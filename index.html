<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prince ❤️ Neelima</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #fffaf0;
      font-family: 'Poppins', sans-serif;
      padding-bottom: 50px;
    }
    .header-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      text-align: center;
      margin-top: 30px;
      color: #b30059;
    }
    .subtitle {
      text-align: center;
      font-size: 1.2rem;
      color: #444;
      margin-bottom: 40px;
    }
    .carousel-item img {
      object-fit: cover;
      height: 400px;
      width: 100%;
    }
    .link-card {
      border: none;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    .link-card img {
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .link-card .btn {
      background-color: #b30059;
      color: white;
      font-weight: 500;
    }
    .link-card .btn:hover {
      background-color: #99004d;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-title">Prince ❤️ Neelima</div>
    <div class="subtitle">Join us as we celebrate our union of love and togetherness</div>

    <!-- Carousel -->
    <div id="weddingCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="2000">
      <div class="carousel-indicators">
        <button type="button" data-bs-target="#weddingCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
        <button type="button" data-bs-target="#weddingCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
        <button type="button" data-bs-target="#weddingCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
        <button type="button" data-bs-target="#weddingCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
      </div>
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="https://images.pexels.com/photos/169198/pexels-photo-169198.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" class="d-block w-100" alt="Wedding Promo">
        </div>
        <div class="carousel-item">
          <img src="https://images.pexels.com/photos/17834/pexels-photo.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" class="d-block w-100" alt="Wedding Live">
        </div>
        <div class="carousel-item">
          <img src="https://images.pexels.com/photos/1045541/pexels-photo-1045541.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" class="d-block w-100" alt="Reception Live">
        </div>
        <div class="carousel-item">
          <img src="https://images.pexels.com/photos/811572/pexels-photo-811572.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" class="d-block w-100" alt="Engagement Live">
        </div>
      </div>
      <button class="carousel-control-prev" type="button" data-bs-target="#weddingCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#weddingCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>

    <!-- Live Links -->
    <div class="row row-cols-1 row-cols-md-2 g-4 mt-4">
      <div class="col">
        <div class="card link-card">
          <img src="https://images.pexels.com/photos/169198/pexels-photo-169198.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Wedding Promo">
          <div class="card-body text-center">
            <h5 class="card-title">Wedding Promo</h5>
            <a href="https://example.com/wedding-promo" class="btn">Watch Promo</a>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card link-card">
          <img src="https://images.pexels.com/photos/17834/pexels-photo.jpg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Wedding Live">
          <div class="card-body text-center">
            <h5 class="card-title">Wedding Live</h5>
            <a href="https://example.com/wedding-live" class="btn">Watch Live</a>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card link-card">
          <img src="https://images.pexels.com/photos/1045541/pexels-photo-1045541.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Reception Live">
          <div class="card-body text-center">
            <h5 class="card-title">Reception Live</h5>
            <a href="https://example.com/reception-live" class="btn">Watch Live</a>
          </div>
        </div>
      </div>
      <div class="col">
        <div class="card link-card">
          <img src="https://images.pexels.com/photos/811572/pexels-photo-811572.jpeg?auto=compress&cs=tinysrgb&w=1260&h=750&dpr=1" alt="Engagement Live">
          <div class="card-body text-center">
            <h5 class="card-title">Engagement Live</h5>
            <a href="https://example.com/engagement-live" class="btn">Watch Live</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
